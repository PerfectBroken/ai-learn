  <rect x="380" y="1820" width="300" height="100" rx="8" fill="var(--surface-3)" stroke="var(--accent-red)" />
  <text x="530" y="1844" text-anchor="middle" class="step red" font-weight="700">AbortSignal（取消）</text>
