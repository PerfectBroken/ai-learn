  <text x="270" y="1700" text-anchor="middle" class="step" font-weight="700">agent.wait调用方</text>
  <text x="270" y="1718" text-anchor="middle" class="note soft mono">收到{status, startedAt,</text>
  <text x="270" y="1734" text-anchor="middle" class="note soft mono">endedAt, error?}</text>

  <rect x="520" y="1678" width="360" height="70" rx="8" fill="var(--surface-3)" stroke="var(--line)" />
  <text x="700" y="1700" text-anchor="middle" class="step" font-weight="700">Gateway审计台账</text>
  <text x="700" y="1718" text-anchor="middle" class="note soft">仅元数据投影（来源+结果码）</text>
