<svg viewBox="0 0 1400 1950" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="OpenClaw Agent Loop从触发到结束的完整流程图（已按源码核实修正结构）。入口：Gateway RPC的agent/agent.wait方法，或CLI命令openclaw agent。①agent这个RPC校验参数、解析session、持久化session元数据，立刻异步返回runId和acceptedAt，不等真正执行完。②agentCommand接管，解析model/thinking/verbose/trace默认值、加载skills快照，然后调用runEmbeddedAgent。③runEmbeddedAgent是一个大容器，内部按真实源码验证过的顺序依次是：先做队列排队与写入方声明（进入session lane，可叠加global lane，接纳后记录activeWriterRunId声明）；然后解析model和auth profile，这一步之前会先跑before_model_resolve插件hook（源码位置embedded-agent-runner/run/setup.ts，注释原文run before_model_resolve hooks early so plugins can override the provider/model before resolveModel）；然后构建session，包括解析创建workspace（可能沙箱化）、注入skills、解析bootstrap上下文文件、准备transcript写入目标和写入方声明；然后组装Prompt（base prompt+skills prompt+bootstrap上下文+本次覆盖项，强制模型限长并预留压缩token），这一步前后分别触发before_prompt_build（注入前后缀上下文或收窄工具面）和before_agent_reply（LLM调用前，可让插件接管整回合或静默）两个hook；然后进入核心工具使用小循环：模型推理流式输出assistant增量，若有工具请求则执行工具（before_tool_call/after_tool_call拦截，tool_result_persist在写入transcript前转换结果），若上下文快满则触发compaction（before_compaction/after_compaction，可能触发重试重置内存缓冲区），循环判断还有没有工具调用，有则回到模型推理，没有则跳出循环；循环结束后在runEmbeddedAgent内部完成Reply整形，拼装文本+推理+工具摘要+错误文本，过滤NO_REPLY静默token，去重消息类工具输出，最终返回payload和用量元数据。runEmbeddedAgent这整个容器左侧标出运行超时在此强制生效，超时即中止。runEmbeddedAgent返回之后，④agentCommand做收尾：如果内嵌循环还没自己发出生命周期结束或报错事件，这里兜底补发一个，agent_end hook在完成后触发带上最终消息列表和运行元数据。⑤subscribeEmbeddedAgentSession把运行时事件桥接成lifecycle: end或error事件。⑥三路分叉：agent.wait的调用方收到status/startedAt/endedAt/error返回；事件流被Gateway投影进只含元数据的审计台账；聊天渠道把缓冲的delta消息收尾成一条chat final消息。图左侧另有一条贯穿runEmbeddedAgent容器附近的红色异常退出路径，列出四种提前结束的方式：Agent超时中止、AbortSignal取消、Gateway断开连接或RPC超时、agent.wait自己超时（仅调用方放弃等待，不会真正停止底层运行）。">
