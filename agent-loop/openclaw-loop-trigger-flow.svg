  <text x="1130" y="1700" text-anchor="middle" class="step" font-weight="700">聊天渠道</text>
  <text x="1130" y="1718" text-anchor="middle" class="note soft">缓冲的delta消息</text>
  <text x="1130" y="1734" text-anchor="middle" class="note soft mono">→收尾成一条chat final</text>

  <!-- abort exit paths -->
  <rect x="30" y="1780" width="1340" height="160" rx="12" fill="var(--accent-red-soft)" stroke="var(--accent-red)" stroke-width="1.6" />
  <text x="50" y="1806" font-size="13" font-weight="700" class="red">哪些情况会让流程在③附近提前结束（不是正常走到⑥）</text>

