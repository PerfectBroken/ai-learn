  <text x="530" y="1878" text-anchor="middle" class="note soft">跟超时是两条不同触发路径</text>

  <rect x="700" y="1820" width="300" height="100" rx="8" fill="var(--surface-3)" stroke="var(--accent-red)" />
  <text x="850" y="1844" text-anchor="middle" class="step red" font-weight="700">Gateway断开/RPC超时</text>
  <text x="850" y="1862" text-anchor="middle" class="note soft">连接层面的中断</text>
  <text x="850" y="1878" text-anchor="middle" class="note soft">不是agent runtime自己判断的</text>

  <rect x="1020" y="1820" width="320" height="100" rx="8" fill="var(--surface-3)" stroke="var(--accent-red)" />
  <text x="1180" y="1844" text-anchor="middle" class="step red" font-weight="700">agent.wait自己超时</text>
  <text x="1180" y="1862" text-anchor="middle" class="note soft">仅调用方放弃等待（默认30秒）</text>
  <text x="1180" y="1878" text-anchor="middle" class="note soft" font-weight="700">不会真正停止底层③的运行</text>
</svg>
