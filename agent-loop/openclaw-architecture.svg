      --surface-3: #E8E1D3;
      --ink: #3B362E;
      --ink-soft: #6E6656;
      --ink-faint: #9A9080;
      --line: #A99C82;
      --accent-red: #AD6656;
      --accent-red-soft: #E4D2CB;
      --sage: #82896F;
      --sage-soft: #DDDCC9;
      --blue: #6E8299;
      --blue-soft: #D8E0E6;
      --plum: #8B7091;
      --plum-soft: #E2D7E3;
      --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #26221C;
        --surface-2: #3C362B;
        --surface-3: #322D24;
        --ink: #EBE3D4;
        --ink-soft: #B3A890;
        --ink-faint: #7C7461;
        --line: #6E6450;
        --accent-red: #CB8875;
        --accent-red-soft: #4A342E;
        --sage: #98A17F;
        --sage-soft: #3A3B2E;
        --blue: #8FA6BC;
        --blue-soft: #33404A;
        --plum: #AD93AE;
        --plum-soft: #3E3540;
      }
    }
    text { font-family: var(--sans); fill: var(--ink); }
    .mono { font-family: var(--mono); }
    .soft { fill: var(--ink-soft); }
    .faint { fill: var(--ink-faint); }
    .red { fill: var(--accent-red); }
    .sage-t { fill: var(--sage); }
    .blue-t { fill: var(--blue); }
    .plum-t { fill: var(--plum); }
    .step { font-size: 12px; }
    .note { font-size: 9.5px; }
  </style>
