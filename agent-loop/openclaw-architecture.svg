<svg viewBox="0 0 1440 1560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="OpenClaw Agent模块架构关系图（已按源码核实修正结构，右侧上下文装配层与插件hooks区块已分层不再重叠）。顶部是入口层：Gateway RPC和CLI，往下连到agentCommand模块。agentCommand往下连到一个大的runEmbeddedAgent容器，这个容器内部从上到下依次是：排队与写入方声明子模块、model与auth profile解析子模块（before_model_resolve插件hook挂在这里，已按源码embedded-agent-runner/run/setup.ts核实，不是挂在agentCommand之前）、构建session子模块（workspace/skills/bootstrap三者从右上方上下文装配层汇入这里）、Prompt组装子模块（before_prompt_build和before_agent_reply两个hook挂在这里）、核心工具使用小循环（内含模型推理、流式输出、工具执行、压缩与重试四个互相循环的子模块，before/after_tool_call、tool_result_persist、before/after_compaction四个hook挂在这里）、Reply整形子模块，最后runEmbeddedAgent返回payload给agentCommand。左列是并发控制层，包含Session lane队列、Global lane队列、SQLite写入队列、Gateway状态目录锁、writer-claim写入方声明，这一列用点线箭头指向runEmbeddedAgent容器内的排队子模块，表示门控关系。右上方是上下文装配层，包含Workspace、Skills快照、Bootstrap上下文文件，用实线箭头汇入容器内的构建session子模块。右下方（在上下文装配层正下方、不再重叠）是插件hooks区块，精确标出六类插件hook各自挂在容器内哪个子模块上。agentCommand收到runEmbeddedAgent返回后做收尾：如果内嵌循环没自己发生命周期事件则兜底补发，agent_end hook在此触发，然后连到subscribeEmbeddedAgentSession桥接成lifecycle事件流。事件流再分叉连到两个下游：Gateway审计台账（仅元数据投影）和聊天渠道处理（delta到final）。图下方是持久化层：Session transcript数据库，左侧并发控制层的writer-claim用一条特殊标注的箭头连到这个transcript，表示每次写入都要核对声明是否仍然有效。图中一个缩小后紧贴agentCommand和runEmbeddedAgent容器本身的虚线红框，标注为超时体系覆盖范围，不再跨到右侧两个区块上。">
