<svg viewBox="0 0 1400 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="图一：单次Decode步骤中语法掩码插入的位置——logits算出后、Softmax之前，不合法token的logit被改成负无穷。图二：token位置时间线对比，tool_choice=auto时先自由生成、检测到trigger字符串才切换进语法约束；tool_choice=required/forced时从第一个token开始就全程语法约束，没有自由生成阶段。">
  <style>
    :root {
      --bg: #F0EBE2;
      --surface-2: #DCD2C0;
      --ink: #3B362E;
      --ink-soft: #6E6656;
      --ink-faint: #9A9080;
      --line: #A99C82;
      --accent-red: #AD6656;
      --accent-red-soft: #E4D2CB;
      --sage: #82896F;
      --sage-soft: #DDDCC9;
      --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #26221C;
        --surface-2: #3C362B;
        --ink: #EBE3D4;
        --ink-soft: #B3A890;
        --ink-faint: #7C7461;
        --line: #6E6450;
        --accent-red: #CB8875;
        --accent-red-soft: #4A342E;
        --sage: #98A17F;
        --sage-soft: #3A3B2E;
      }
    }
    text { font-family: var(--sans); fill: var(--ink); }
    .mono { font-family: var(--mono); }
    .soft { fill: var(--ink-soft); }
    .faint { fill: var(--ink-faint); }
    .red { fill: var(--accent-red); }
    .title { font-weight: 700; font-size: 15px; }
  </style>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--line)" />
    </marker>
    <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--sage)" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="500" fill="var(--bg)" />

  <!-- ===== Panel A: single decode step ===== -->
  <text x="20" y="24" class="title">① 单次Decode步骤：语法掩码插入的位置</text>

  <!-- pipeline boxes -->
  <!-- box1 hidden state -->
  <rect x="14" y="45" width="148" height="70" rx="8" fill="var(--surface-2)" stroke="var(--line)" />
  <text x="88" y="73" text-anchor="middle" font-size="12.5" font-weight="600">上一步隐藏状态</text>
  <text x="88" y="90" text-anchor="middle" font-size="11.5" class="soft">(d_model维)</text>

  <line x1="162" y1="80" x2="182" y2="80" stroke="var(--line)" stroke-width="1.5" marker-end="url(#a1)" />

  <!-- box2 LM Head Linear -->
  <rect x="184" y="45" width="148" height="70" rx="8" fill="var(--surface-2)" stroke="var(--line)" />
  <text x="258" y="73" text-anchor="middle" font-size="12.5" font-weight="600">LM Head</text>
  <text x="258" y="90" text-anchor="middle" font-size="12.5" font-weight="600">Linear</text>

  <line x1="332" y1="80" x2="352" y2="80" stroke="var(--line)" stroke-width="1.5" marker-end="url(#a1)" />

  <!-- box3 logits -->
  <rect x="354" y="45" width="148" height="70" rx="8" fill="var(--surface-2)" stroke="var(--line)" />
  <text x="428" y="73" text-anchor="middle" font-size="12.5" font-weight="600">logits</text>
  <text x="428" y="90" text-anchor="middle" font-size="11.5" class="soft">(vocab_size维)</text>

  <line x1="502" y1="80" x2="522" y2="80" stroke="var(--accent-red)" stroke-width="2" marker-end="url(#a1)" />

  <!-- box4 语法掩码 RED -->
  <rect x="524" y="40" width="158" height="80" rx="8" fill="var(--accent-red-soft)" stroke="var(--accent-red)" stroke-width="2" />
  <text x="603" y="66" text-anchor="middle" font-size="12.5" font-weight="700" class="red">语法掩码</text>
  <text x="603" y="83" text-anchor="middle" font-size="11" class="red">不合法token的logit</text>
  <text x="603" y="98" text-anchor="middle" font-size="11" class="mono red">→ -∞</text>

  <line x1="682" y1="80" x2="702" y2="80" stroke="var(--accent-red)" stroke-width="2" marker-end="url(#a1)" />

  <!-- box5 Softmax -->
  <rect x="704" y="45" width="128" height="70" rx="8" fill="var(--surface-2)" stroke="var(--line)" />
  <text x="768" y="83" text-anchor="middle" font-size="12.5" font-weight="600">Softmax</text>

  <line x1="832" y1="80" x2="852" y2="80" stroke="var(--line)" stroke-width="1.5" marker-end="url(#a1)" />

  <!-- box6 概率分布 -->
  <rect x="854" y="45" width="128" height="70" rx="8" fill="var(--surface-2)" stroke="var(--line)" />
  <text x="918" y="83" text-anchor="middle" font-size="12.5" font-weight="600">概率分布</text>

  <line x1="982" y1="80" x2="1002" y2="80" stroke="var(--line)" stroke-width="1.5" marker-end="url(#a1)" />

  <!-- box7 采样 -->
  <rect x="1004" y="45" width="148" height="70" rx="8" fill="var(--surface-2)" stroke="var(--line)" />
  <text x="1078" y="73" text-anchor="middle" font-size="12.5" font-weight="600">采样</text>
  <text x="1078" y="90" text-anchor="middle" font-size="11" class="soft">temperature/top-p</text>

  <line x1="1152" y1="80" x2="1172" y2="80" stroke="var(--line)" stroke-width="1.5" marker-end="url(#a1)" />

  <!-- box8 选中token -->
  <rect x="1174" y="45" width="130" height="70" rx="8" fill="var(--surface-2)" stroke="var(--line)" />
  <text x="1239" y="83" text-anchor="middle" font-size="12.5" font-weight="600">选中的token</text>

  <!-- loop back -->
  <path d="M1239,115 L1239,148 L88,148 L88,115" fill="none" stroke="var(--sage)" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#a2)" />
  <text x="664" y="164" text-anchor="middle" font-size="11.5" fill="var(--sage)">下一步Decode（约束逐步重新计算，每个token都要重来一次）</text>

  <line x1="20" y1="184" x2="1380" y2="184" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 4" />

  <!-- ===== Panel B: auto vs required timeline ===== -->
  <text x="20" y="208" class="title">② tool_choice = auto vs required：约束从哪个token开始生效</text>

  <!-- row 1: auto -->
  <text x="20" y="234" font-size="12.5" font-weight="700">tool_choice = auto</text>
  <g>
    <!-- free tokens 0-4 -->
    <rect x="40" y="244" width="60" height="46" rx="4" fill="var(--sage-soft)" stroke="var(--sage)" />
    <rect x="110" y="244" width="60" height="46" rx="4" fill="var(--sage-soft)" stroke="var(--sage)" />
    <rect x="180" y="244" width="60" height="46" rx="4" fill="var(--sage-soft)" stroke="var(--sage)" />
    <rect x="250" y="244" width="60" height="46" rx="4" fill="var(--sage-soft)" stroke="var(--sage)" />
    <rect x="320" y="244" width="60" height="46" rx="4" fill="var(--sage-soft)" stroke="var(--sage)" />
    <!-- trigger marker -->
    <line x1="404" y1="234" x2="404" y2="300" stroke="var(--accent-red)" stroke-width="1.5" stroke-dasharray="3 3" />
    <!-- constrained tokens -->
    <rect x="418" y="244" width="60" height="46" rx="4" fill="var(--accent-red-soft)" stroke="var(--accent-red)" />
    <rect x="488" y="244" width="60" height="46" rx="4" fill="var(--accent-red-soft)" stroke="var(--accent-red)" />
    <rect x="558" y="244" width="60" height="46" rx="4" fill="var(--accent-red-soft)" stroke="var(--accent-red)" />
    <rect x="628" y="244" width="60" height="46" rx="4" fill="var(--accent-red-soft)" stroke="var(--accent-red)" />
    <rect x="698" y="244" width="60" height="46" rx="4" fill="var(--accent-red-soft)" stroke="var(--accent-red)" />
    <rect x="768" y="244" width="60" height="46" rx="4" fill="var(--accent-red-soft)" stroke="var(--accent-red)" />
    <rect x="838" y="244" width="60" height="46" rx="4" fill="var(--accent-red-soft)" stroke="var(--accent-red)" />
  </g>
  <text x="220" y="270" text-anchor="middle" font-size="11" fill="var(--sage)">自由生成，无约束</text>
  <text x="404" y="316" text-anchor="middle" font-size="11" font-weight="700" class="red">检测到trigger</text>
  <text x="404" y="330" text-anchor="middle" font-size="10.5" class="mono red">（如 "&lt;tool_call&gt;"）</text>
  <text x="658" y="270" text-anchor="middle" font-size="11" class="red">语法约束生效</text>

  <!-- row 2: required -->
  <text x="20" y="360" font-size="12.5" font-weight="700">tool_choice = required / forced</text>
  <g>
    <rect x="40" y="370" width="60" height="46" rx="4" fill="var(--accent-red-soft)" stroke="var(--accent-red)" />
    <rect x="110" y="370" width="60" height="46" rx="4" fill="var(--accent-red-soft)" stroke="var(--accent-red)" />
    <rect x="180" y="370" width="60" height="46" rx="4" fill="var(--accent-red-soft)" stroke="var(--accent-red)" />
    <rect x="250" y="370" width="60" height="46" rx="4" fill="var(--accent-red-soft)" stroke="var(--accent-red)" />
    <rect x="320" y="370" width="60" height="46" rx="4" fill="var(--accent-red-soft)" stroke="var(--accent-red)" />
    <rect x="390" y="370" width="60" height="46" rx="4" fill="var(--accent-red-soft)" stroke="var(--accent-red)" />
    <rect x="460" y="370" width="60" height="46" rx="4" fill="var(--accent-red-soft)" stroke="var(--accent-red)" />
    <rect x="530" y="370" width="60" height="46" rx="4" fill="var(--accent-red-soft)" stroke="var(--accent-red)" />
    <rect x="600" y="370" width="60" height="46" rx="4" fill="var(--accent-red-soft)" stroke="var(--accent-red)" />
    <rect x="670" y="370" width="60" height="46" rx="4" fill="var(--accent-red-soft)" stroke="var(--accent-red)" />
    <rect x="740" y="370" width="60" height="46" rx="4" fill="var(--accent-red-soft)" stroke="var(--accent-red)" />
    <rect x="810" y="370" width="60" height="46" rx="4" fill="var(--accent-red-soft)" stroke="var(--accent-red)" />
  </g>
  <text x="440" y="396" text-anchor="middle" font-size="11" class="red">从第1个token开始，全程语法约束——没有"等trigger"这个阶段</text>

  <!-- legend -->
  <rect x="20" y="440" width="16" height="16" rx="3" fill="var(--sage-soft)" stroke="var(--sage)" />
  <text x="42" y="452" font-size="11" class="soft">自由生成（无约束，任意token都可能被采样到）</text>
  <rect x="420" y="440" width="16" height="16" rx="3" fill="var(--accent-red-soft)" stroke="var(--accent-red)" />
  <text x="442" y="452" font-size="11" class="red">语法约束生效（不合法token概率恒为0）</text>
</svg>
